# Default ALSA device for command-line playback/recording.
# On RK3588, card 0 may be HDMI-in capture only; ES8388 is card id
# "rockchipes8388" and provides the headphone/speaker playback device.
pcm.!default {
    type plug
    slave.pcm "sysdefault:CARD=rockchipes8388"
}

ctl.!default {
    type hw
    card "rockchipes8388"
}
