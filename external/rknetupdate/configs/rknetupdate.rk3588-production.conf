# Verified deployment profile for the iTOP-RK3588 at 192.168.1.118.
# The board's eMMC layout is mmcblk0p1=uboot, p2=misc, p3=boot,
# p4=recovery, p6=rootfs.
listen=0.0.0.0:17888
token=topeet

upload_dir=/var/lib/rknetupdate/uploads
max_upload_mib=128
expected_parent_device=/dev/mmcblk0
test_mode=false

# U-Boot and Boot are actual one-click writes in this profile.  The service
# re-resolves the partition and parent disk immediately before every write.
allow_flash=true
dry_run=false
uboot_device=/dev/disk/by-partlabel/uboot
boot_device=/dev/disk/by-partlabel/boot

# p4 has been verified against the matching RKNetUpdate recovery image.
# Rootfs and OTA writes remain offline: the running normal system never
# opens the mounted rootfs partition for raw writing.
rootfs_enabled=true
rootfs_allow_write=true
rootfs_max_upload_mib=8192
rootfs_device=/dev/disk/by-partlabel/rootfs
rootfs_stage_dir=/var/lib/rknetupdate/rootfs-v2
rootfs_e2fsck=/usr/sbin/e2fsck

bundle_enabled=true
bundle_allow_write=true
bundle_max_upload_mib=8448
bundle_stage_dir=/var/lib/rknetupdate/bundle-v1

# Complete Rockchip RKFW/RKAF package OTA.  The service stages update.img,
# then the RKNetUpdate-aware recovery delegates the package to the SDK
# updateEngine and removes its temporary userdata partition afterwards.
updateimg_enabled=true
updateimg_allow_write=true
updateimg_max_upload_mib=8192
updateimg_stage_dir=/var/lib/rknetupdate/updateimg-v1
