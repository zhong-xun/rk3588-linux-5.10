[core]
backend=drm-backend.so
# Software cursors avoid vendor DRM cursor-plane format differences.
sw-cursor=true
# desktop-shell is the Weston default; leave shell unset for recovery.
require-input=false
require-outputs=none
idle-time=0
# A fixed window also works with older DRM timestamp implementations.
repaint-window=7

[shell]
panel-scale=3
cursor-size=32
clock-with-date=false
locking=false
startup-animation=none

[keyboard]
vt-switching=false
